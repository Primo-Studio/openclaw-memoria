name: CI

# CI V3 — remplace l'ancienne CI qui tolérait 51 erreurs TS et n'exécutait pas les tests.
# Règle : 0 erreur TypeScript, tous les tests s'exécutent réellement, boot-test du daemon.

on:
  push:
    branches: [main, memoria-v1]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (tsc strict, 0 erreur tolérée)
        run: npm run build
      - name: Tests (exécution réelle — la CI casse si un test casse)
        run: npm test
      - name: Boot-test daemon
        run: node scripts/boot-test.mjs
