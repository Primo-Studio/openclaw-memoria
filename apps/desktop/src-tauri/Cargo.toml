# App bureau Memoria — lanceur Tauri v2 (spec §14, voie « non-dev »).
# v1 pragmatique : pas de Node embarqué (v1.5), on s'appuie sur le Node ≥ 20
# de la machine pour démarrer le daemon, puis la webview bascule sur son UI.
[package]
name = "memoria-desktop"
version = "0.1.0"
description = "Memoria — app bureau (lanceur du daemon local + UI web)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.82" # Option::is_none_or (au-dessus du MSRV 1.77 de Tauri 2)

[lib]
name = "memoria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lecture de ~/.memoria/config.toml (même résolution que core/config.ts).
toml = "0.8"

[profile.release]
# Binaire compact pour le bundle .app (recommandations Tauri).
codegen-units = 1
lto = true
opt-level = "s"
strip = true
